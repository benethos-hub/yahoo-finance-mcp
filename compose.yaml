# Docker Compose file for hosting the server over the streamable-HTTP transport.
# Usage:
#   docker compose up -d        # build (if needed) and start in the background
#   docker compose logs -f      # follow logs
#   docker compose down         # stop and remove
#
# The modern canonical filename is compose.yaml; `docker compose` also still
# reads the legacy docker-compose.yml name.

# Project name for all resources compose creates (network, volume, default
# container names). Without this it would default to the directory name.
name: benethos-yahoo-finance-mcp

services:
  benethos-yahoo-finance-mcp:
    # ---- Build from this checkout, or pull the published image? ----
    #
    # As shipped: BUILD. `docker compose up -d` builds from the Dockerfile the
    # first time and reuses that image afterwards. Rebuild explicitly with
    # `docker compose build`. This is what you want while developing, and it is
    # the only option that can run an unreleased `main`.
    #
    # To OPERATE the released server instead, comment the two lines below and
    # uncomment the two after them. You then need nothing from this repository
    # except this file — no clone, no Dockerfile, no Python.
    build: .
    image: benethos-yahoo-finance-mcp:latest
    # image: ghcr.io/benethos-hub/yahoo-finance-mcp:latest
    # pull_policy: always
    #
    # `pull_policy` decides when compose contacts the registry: `always` on
    # every `up`, `missing` only when the image is absent locally, `never` not
    # at all. Pin a version (`:0.5.1`) or a minor line (`:0.5`) instead of
    # `latest` for anything you depend on.
    container_name: benethos-yahoo-finance-mcp
    ports:
      # bind:host:container — published on the loopback interface only, because
      # the server is unauthenticated by default and has no business on the
      # LAN. Set YF_MCP_BEARER_TOKEN below to require a token per request. Drop
      # the 127.0.0.1 prefix only behind a reverse proxy that handles auth.
      # Change the host port (the middle number) if 8000 is already taken.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # All configuration is via environment variables. The image already sets
    # sensible defaults (streamable-HTTP on 0.0.0.0:8000, cache at /cache);
    # override any of them here.
    environment:
      # YF_MCP_TRANSPORT: streamable-http
      # YF_MCP_HOST: "0.0.0.0"
      # YF_MCP_PORT: "8000"
      # YF_MCP_PATH: /mcp
      # An exposed bind (0.0.0.0) accepts any Host header by default. Lock the
      # DNS-rebinding guard down to specific hosts if you want to (clients with
      # another Host then get HTTP 421):
      # YF_MCP_ALLOWED_HOSTS: "benethos-yahoo-finance-mcp:8000"
      # Require a bearer token on every HTTP request. Off by default: on a
      # loopback-published port it guards against nothing. Anything that can
      # reach the port can otherwise call every tool.
      # YF_MCP_BEARER_TOKEN: "change-me-to-something-long-and-random"
      YF_MCP_LOG_LEVEL: INFO
      # The result cache is opt-in (off by default). Enable it and it persists
      # to the /cache volume below:
      # YF_MCP_CACHE: "1"
      YF_MCP_CACHE_DIR: /cache
      # Override a single tool's cache TTL (seconds), e.g.:
      # YF_MCP_CACHE_TTL_QUOTE: "15"
    volumes:
      # Used only when the cache is enabled; persists it across restarts.
      - cache:/cache

volumes:
  cache:
