<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Finance Data MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#3B4A63"/>
      <stop offset="55%" stop-color="#2A3750"/>
      <stop offset="100%" stop-color="#1B2538"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.50"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#3E4F6B"/>
      <stop offset="100%" stop-color="#6B7C99"/>
    </linearGradient>

    <clipPath id="plate">
      <rect width="256" height="256" rx="56"/>
    </clipPath>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1120" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <g clip-path="url(#plate)">
    <ellipse cx="78" cy="22" rx="150" ry="92" fill="url(#gloss)"/>
  </g>

  <g filter="url(#lift)">
    <g fill="url(#bar)">
      <rect x="42" y="158" width="28" height="46" rx="8"/>
      <rect x="90" y="130" width="28" height="74" rx="8"/>
      <rect x="138" y="146" width="28" height="58" rx="8"/>
      <rect x="186" y="104" width="28" height="100" rx="8"/>
    </g>
    <g fill="#FFFFFF" opacity="0.18">
      <rect x="46" y="161" width="20" height="5" rx="2.5"/>
      <rect x="94" y="133" width="20" height="5" rx="2.5"/>
      <rect x="142" y="149" width="20" height="5" rx="2.5"/>
      <rect x="190" y="107" width="20" height="5" rx="2.5"/>
    </g>
  </g>

  <rect x="36" y="202" width="184" height="4" rx="2" fill="#94A3B8" opacity="0.5"/>

  <g filter="url(#lift)">
    <polyline points="56,152 104,118 152,134 200,76"
              fill="none" stroke="url(#line)" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1B2538" stroke="url(#line)" stroke-width="7">
      <circle cx="56" cy="152" r="10"/>
      <circle cx="104" cy="118" r="10"/>
      <circle cx="152" cy="134" r="10"/>
      <circle cx="200" cy="76" r="12"/>
    </g>
  </g>

  <rect x="7" y="7" width="242" height="242" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
