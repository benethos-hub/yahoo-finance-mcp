[build-system]
# Exact, since uv.lock pins what runs and not what builds this package. An image
# build and the first start of the pinned bundle build the wheel. A release
# moves it by hand, like the image tags (CLAUDE.md, Releasing).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "benethos-yahoo-finance-mcp"
version = "0.13.0"
description = "Unofficial read-only MCP server exposing Yahoo Finance data (via yfinance) over stdio or HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Benedikt Oswald" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "yahoo-finance",
    "yfinance",
    "finance",
    "financial-data",
    "market-data",
    "stock-market",
    "stocks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # The six that decide what an answer looks like stay inside a patch window,
    # at the versions tested last. The auto-update extension and uvx install the
    # newest versions allowed, so a patch reaches them by itself. A minor waits
    # until it was checked, the window raised and released: both real breaks of
    # this server through a dependency came with one, mcp 2.1.0 and pandas 3.1.0.
    #
    # Plain `mcp`, not `mcp[cli]`. The extra only adds the `mcp` command
    # (dev/run/install) and pulls typer, rich and pygments with it. This package
    # defines its own entry point and never imports them. It lives in `dev`.
    # 2.2.0 fixes GHSA-84m7-p3x7-pcfv: a stateful Streamable HTTP server never
    # reclaimed its sessions, and this server offers that transport.
    "mcp~=2.3.0",
    # 1.8.0 reaches the ticker's news again, through the GraphQL route Yahoo's
    # site uses since it dropped the old one (ranaroussi/yfinance#3018), and
    # stops tripping pandas 3.1's deprecation of `inplace` (#3020).
    "yfinance~=1.8.0",
    # Imported directly by formatting.py, so named here and not only reached
    # through yfinance.
    "pandas~=3.1.0",
    # Imported directly by server.py and the tools, so named here and not only
    # reached through mcp. It pins pydantic-core exactly, which tools/_base.py
    # imports too. The lower bound is what mcp 2.2.0 asks for.
    "pydantic~=2.14.2",
    # Required by yfinance for HTML-table scraping (e.g. earnings dates).
    # 6.1.0 fixes GHSA-vfmq-68hx-4jfw, XXE in iterparse() and ETCompatXMLParser().
    "lxml~=6.1.3",
    # Nothing here imports it. yfinance reaches Yahoo through it, so its version
    # decides whether Yahoo answers, and only the window is why it is named.
    "curl_cffi~=0.17.0",
]

[project.urls]
Homepage = "https://github.com/benethos-hub/yahoo-finance-mcp"
Repository = "https://github.com/benethos-hub/yahoo-finance-mcp"
Issues = "https://github.com/benethos-hub/yahoo-finance-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "mypy>=2.1.0",
    # Gives back the `mcp` command, whose `mcp dev` runs a server against the
    # MCP Inspector. A development tool, so it belongs here and not in the
    # runtime dependencies.
    "mcp[cli]~=2.3.0",
]

[project.scripts]
# One name only, identical to the distribution name, so `uvx
# benethos-yahoo-finance-mcp` works and every identifier matches.
benethos-yahoo-finance-mcp = "benethos_yahoo_finance_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benethos_yahoo_finance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["benethos_yahoo_finance_mcp"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, not-too-noisy rule set.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "W",    # pycodestyle warnings
    "BLE",  # blind except, each one here carries its reason
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# yfinance and pandas ship without (complete) type stubs.
[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas", "pandas.*"]
ignore_missing_imports = true
