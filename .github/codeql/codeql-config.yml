name: CodeQL configuration

# The rules CodeQL leaves out in this repository, each with its reason. This
# file is for a rule that never applies here. A rule that fires wrongly in one
# place is dismissed in the Security tab with its reason instead, so that a
# new finding stands out. The query suite is not set here: it is the input of
# the organisation's workflow, which both calls in .github/workflows share.
query-filters:
  # The organisation's workflows and actions in benethos-hub/.github are
  # followed at main on purpose: a rule changed there applies here on the next
  # run, and that repository pins the actions it uses itself (SPECS §10,
  # CLAUDE.md). Every other action is pinned to a commit SHA with its version
  # beside it, which tests/test_codeql.py holds in this rule's place.
  - exclude:
      id: actions/unpinned-tag
