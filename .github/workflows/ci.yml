name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes anything back. Without this the token gets whatever the
# repository default happens to be, which is a wider grant than any job needs.
permissions:
  contents: read

jobs:
  # brand, lint, test, lowest-versions, audit and coverage-badge are the
  # organisation's reusable workflows in benethos-hub/.github, the same for
  # every Python project there. Each one explains itself in its file. They are
  # followed at main on purpose, so a rule changed there applies here on the
  # next run, and Dependabot in that repository keeps the actions they pin
  # current. What stays here is what only this project has: fresh-install and
  # docker.

  # assets/brand/icon.svg, and a 512x512 icon.png and a 1280x640
  # social-preview.png exported from it, neither older than the SVG.
  # assets/render_icon.py writes both PNGs.
  brand:
    uses: benethos-hub/.github/.github/workflows/brand.yml@main

  # uv.lock in step with pyproject.toml, ruff, the formatting and mypy.
  lint:
    uses: benethos-hub/.github/.github/workflows/python-lint.yml@main
    with:
      sync-args: --extra dev

  # pytest on every supported Python against uv.lock, and on the newest alone
  # the coverage with its floor of 80 %, so test / Python 3.15 being a
  # required check is what makes the floor block a merge. The unit tests mock
  # yfinance and run offline. tests/smoke.py is not collected, it is the only
  # part that would reach Yahoo.
  #
  # The versions are named here although the workflow has the same defaults.
  # Which Pythons this project supports is its own decision, and
  # tests/test_packaging.py ties these lines to the classifiers,
  # requires-python and the documentation. A default changed in the
  # organisation's repository would otherwise move the tests away from them
  # without a word.
  #
  # badge: true has the coverage run write the measured percentage as a
  # badge, which coverage-badge below publishes.
  test:
    uses: benethos-hub/.github/.github/workflows/python-tests.yml@main
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python: "3.15"
      sync-args: --extra dev
      cov: benethos_yahoo_finance_mcp
      badge: true
      timeout-minutes: 10

  # The coverage badge in the README, as coverage.json on the badges branch.
  # It runs on a push to main only, so the badge shows main's coverage, and a
  # pull request never runs it. That is why it is no required check.
  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    uses: benethos-hub/.github/.github/workflows/coverage-badge.yml@main
    permissions:
      contents: write # push coverage.json to the badges branch

  # Every other job installs from uv.lock, which pins the dependencies to a
  # known-good set. That is what we want for reproducibility, but it hides a
  # broken *declared* range: 0.3.0 shipped `mcp[cli]>=1.28.0` with no upper
  # bound, resolved to mcp 2.0 on a fresh install and failed at import, while
  # the whole suite stayed green. This job resolves dependencies the way a user
  # does, with no lockfile involved.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the wheel
        run: uv build --wheel

      - name: Install it into a clean environment (no lockfile) and start it
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          echo "--- resolved dependency versions ---"
          uv pip list --python /tmp/fresh/bin/python
          echo "--- import and entry point ---"
          /tmp/fresh/bin/python -c "import benethos_yahoo_finance_mcp as p; print('version', p.__version__)"
          echo "--- registered tools ---"
          # An assertion, not a report. Printing the count would stay green at
          # zero, and zero is exactly the interesting failure: it means the
          # server was built but register_tools added nothing. Naming
          # one tool catches a registry that is populated but wrong.
          /tmp/fresh/bin/python - <<'PY'
          import asyncio

          from benethos_yahoo_finance_mcp.server import mcp

          names = sorted(tool.name for tool in asyncio.run(mcp.list_tools()))
          assert names, "no tools registered: the import succeeded but registration did not"
          assert "get_quote" in names, f"get_quote is not among the registered tools: {names}"
          print(f"tools {len(names)}, including get_quote")
          PY
          /tmp/fresh/bin/benethos-yahoo-finance-mcp --help > /dev/null
          echo "OK: a fresh install imports, registers its tools and starts"

  # The other half of what fresh-install checks. That job resolves the newest
  # versions pyproject.toml allows, this one the oldest: every direct
  # dependency at its declared lower bound, on the oldest supported Python
  # (named here for the same reason as in test), without the lockfile, and
  # the tests against them. pytest at the floor the dev extra
  # declares, the suite needs no other plugin. The audit checks those versions
  # for known vulnerabilities as well. A red run means a lower bound in
  # pyproject.toml needs raising, in the same pull request. The suite mocks
  # yfinance, so green here says the code runs against those versions, not
  # that Yahoo answers them the same way.
  lowest-versions:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      requirements: pytest>=9.1.1
      audit: true
      timeout-minutes: 10

  # Every version pinned in uv.lock, for every platform and Python version,
  # checked against PyPI and OSV for known vulnerabilities. GitHub's
  # dependency graph does not read uv.lock, so nothing else covers the
  # packages that land in the image. A vulnerability without a fix yet is
  # waived with ignore-vulns, here and in lowest-versions alike.
  audit:
    uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f containers/images/yahoo-finance-mcp/Dockerfile -t benethos-yahoo-finance-mcp:ci .

      # No test reaches the Compose files: the suite is offline Python and a
      # Compose file is neither. Both are read as compose resolves them, and
      # three things are asserted. That they are valid at all. That every
      # published port stays on the loopback address, which is a deliberate
      # choice - the server has no authentication of its own and no business
      # on the LAN. And that each folder is what its name says: development
      # builds from the checkout, production pulls the published image and
      # builds nothing, and both keep the root file system read-only. Until
      # now such decisions lived in comments, and a comment is not something
      # a change can trip over.
      #
      # This constrains the files in this repository and nothing else. Anyone
      # running them stays free to publish on the LAN by editing their copy or
      # adding an override file, neither of which CI ever sees. Production
      # needs its version, which it reads from the template here, and is
      # rendered with its profile https, so Caddy is checked as well. Caddy is
      # the one exception to the loopback rule: it exists to answer on 443
      # from everywhere, and it may publish that port and no other.
      - name: Compose files are valid, loopback only, and what their folder says
        run: |
          set -euo pipefail
          docker compose -f containers/development/compose.yaml config --format json \
            > /tmp/development.json
          docker compose -f containers/production/compose.yaml \
            --env-file containers/production/.env.example --profile https \
            config --format json > /tmp/production.json
          python3 - <<'PY'
          import json

          # The proxy in production, the only service that may publish beyond
          # the loopback address, and only these ports.
          PROXY = ("production", "caddy")
          PROXY_PORTS = {("443", "tcp"), ("443", "udp")}

          for folder in ("development", "production"):
              services = json.load(open(f"/tmp/{folder}.json"))["services"]
              assert services, f"the {folder} Compose file defines no services"
              if folder == "production":
                  assert "caddy" in services, "production renders without its Caddy"
              for name, service in services.items():
                  where = f"{folder}: {name}"
                  if (folder, name) == PROXY:
                      published = {
                          (port.get("published"), port.get("protocol"))
                          for port in service.get("ports") or []
                      }
                      assert published == PROXY_PORTS, (
                          f"{where} publishes {sorted(published)}, not 443 alone"
                      )
                      assert service.get("read_only") is True, f"{where} is not read-only"
                      assert "build" not in service, f"{where} builds instead of pulling"
                      assert service.get("cap_drop") == ["ALL"], f"{where} keeps capabilities"
                      print(f"OK: {where} publishes 443 only, read-only, pulls")
                      continue
                  for port in service.get("ports") or []:
                      host_ip = port.get("host_ip")
                      assert host_ip in ("127.0.0.1", "::1"), (
                          f"{where} publishes port {port.get('published')} on "
                          f"{host_ip or 'every interface'}, not on the loopback address"
                      )
                      print(f"OK: {where} publishes {host_ip}:{port.get('published')}")
                  assert service.get("read_only") is True, f"{where} is not read-only"
                  if folder == "development":
                      assert "build" in service, f"{where} does not build from the checkout"
                  else:
                      assert "build" not in service, f"{where} builds instead of pulling"
                      assert service["image"].startswith(
                          "ghcr.io/benethos-hub/benethos-yahoo-finance-mcp:"
                      ), f"{where} runs {service['image']}, not the published image"
                  print(f"OK: {where} is read-only and {'builds' if folder == 'development' else 'pulls'}")
          PY

      # The release workflow publishes linux/amd64 *and* linux/arm64, but only
      # amd64 is built above, so an arm64-only break would first surface during
      # a release. Build it here as well. Nothing is loaded or pushed — that the
      # build completes is the assertion, and running it is what the smoke test
      # below covers on the native architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/yahoo-finance-mcp/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the container and confirm the HTTP server actually serves. A bare
      # GET on the streamable-HTTP endpoint is rejected for missing headers, so
      # the status varies by SDK version (406 on mcp 1.x, 400 on 2.x). Any HTTP
      # response at all is what proves the server is up, so do not assert on a
      # specific code here.
      - name: Smoke test (server boots and serves HTTP)
        run: |
          set -euo pipefail
          name=benethos-yahoo-finance-mcp-ci

          # Deliberately no --rm. A container that crashes has to stay around,
          # otherwise `docker logs` finds nothing exactly when there is
          # something to read.
          docker run -d -p 8000:8000 --name "$name" benethos-yahoo-finance-mcp:ci

          code=000
          for _ in $(seq 1 20); do
            # On a connection failure curl prints 000 for %{http_code} *and*
            # exits non-zero, so a `|| echo 000` inside the substitution would
            # leave two values in the variable and every later comparison
            # against "000" would be false. The fallback has to be an
            # assignment outside the substitution.
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/mcp) || code=000
            if [ "$code" != "000" ]; then
              break
            fi
            sleep 1
          done

          # The Dockerfile declares a HEALTHCHECK and the Compose service leans
          # on it, but it is a shell command inside a string that nothing else
          # here ever runs. The loop leaves early when the container is gone,
          # so a crash is not paid for with the full wait.
          status=missing
          health=missing
          for _ in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Status}}' "$name") || status=missing
            health=$(docker inspect -f '{{.State.Health.Status}}' "$name") || health=missing
            if [ "$status" != "running" ] || [ "$health" != "starting" ]; then
              break
            fi
            sleep 3
          done

          docker logs "$name" || true
          echo "container status: $status, health: $health"
          docker rm -f "$name" > /dev/null || true

          # A port that answers is one part, a process that is still alive is
          # the second, and a health check that agrees is the third. A server
          # that serves one request and then dies would pass on the status
          # code alone.
          if [ "$code" = "000" ]; then
            echo "::error::server did not respond on :8000 (container status: $status)"
            exit 1
          fi
          if [ "$status" != "running" ]; then
            echo "::error::container is not running (status: $status)"
            exit 1
          fi
          if [ "$health" != "healthy" ]; then
            echo "::error::the container health check reports $health"
            exit 1
          fi
          echo "OK: HTTP $code, container running, health check $health"
