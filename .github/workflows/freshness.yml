name: Freshness

# Two questions about the versions, answered once a day in one run and two
# issues, through the organisation's freshness workflow:
#
#   * "Pinned versions have newer releases", the organisation's report: every
#     package uv.lock pins that has a newer release, within the patch windows
#     and beyond them, the build backend, known vulnerabilities, the images of
#     the Dockerfile and the compose files, the actions pinned by commit.
#   * "Newest dependency versions break the server", this repository's own
#     question. The auto-update extension and uvx install the newest versions
#     pyproject.toml allows, not the ones in uv.lock, so what a user runs can
#     change on any day without a release here. The job newest below installs
#     them, runs the tests and a live run against Yahoo, and leaves its result
#     as an artifact the organisation's report reads (docs/freshness.md there,
#     "A job of the repository"). A run that proves nothing, Yahoo refusing
#     the locked versions too or rate-limiting the run, leaves the alarm issue
#     as it was.
#
# Nothing here commits anything: the upgraded lockfile stays in the runner.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness

jobs:
  newest:
    name: Newest versions allowed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # First the locked versions. When Yahoo refuses those too, a failure on
      # the newest ones says nothing about the versions. A second after each
      # call: a runner shares its address with everyone else on GitHub, and a
      # limit Yahoo sets for that address would read as a failure here. Exit
      # code 3 is a rate limit. Each step's result goes into the artifact, so
      # a red one must not stop the job before it gets there.
      - name: Smoke run on the locked versions
        id: locked
        run: |
          uv sync --frozen --extra dev
          code=0
          uv run --frozen python tests/smoke.py --pause 1 || code=$?
          case "$code" in
            0) result=success ;;
            3) result=rate-limited ;;
            *) result=failure ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Install the newest versions allowed
        run: |
          cp uv.lock "$RUNNER_TEMP/uv.lock.before"
          uv lock --upgrade
          uv sync --frozen --extra dev

      - name: Tests
        id: tests
        continue-on-error: true
        run: uv run --frozen pytest -q

      - name: Smoke run on the newest versions
        id: smoke
        run: |
          code=0
          uv run --frozen python tests/smoke.py --pause 1 || code=$?
          case "$code" in
            0) result=success ;;
            3) result=rate-limited ;;
            *) result=failure ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Write the result for the report
        env:
          LOCKED: ${{ steps.locked.outputs.result }}
          TESTS: ${{ steps.tests.outcome }}
          SMOKE: ${{ steps.smoke.outputs.result }}
        run: |
          uv run --frozen python .github/scripts/freshness_newest.py \
            --before "$RUNNER_TEMP/uv.lock.before" --after uv.lock \
            --locked "$LOCKED" --tests "$TESTS" --smoke "$SMOKE" \
            --out "$RUNNER_TEMP/freshness/newest"

      - name: Leave the result for the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshness-newest
          path: ${{ runner.temp }}/freshness/newest
          retention-days: 7

  # Runs whatever happened before: a job that died before its upload is a
  # line in the pins report, not a silent gap, since extra-jobs names it.
  freshness:
    name: Freshness report
    needs: newest
    if: ${{ !cancelled() }}
    uses: benethos-hub/.github/.github/workflows/freshness.yml@main
    permissions:
      contents: read
      issues: write
    with:
      issue-title: Pinned versions have newer releases
      extra-jobs: newest
      alarm-title: Newest dependency versions break the server
      alarm-resolved: The newest dependency versions work.
