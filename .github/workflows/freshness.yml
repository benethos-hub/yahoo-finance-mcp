name: Freshness

# Two questions about the versions, answered once a day in one run and two
# issues, through the organisation's freshness workflow (docs/freshness.md in
# benethos-hub/.github):
#
#   * "Pinned versions have newer releases", the organisation's report: every
#     package uv.lock pins that has a newer release, within the patch windows
#     and beyond them, the build backend, known vulnerabilities, the images of
#     the Dockerfile and the compose files, the actions pinned by commit, and
#     under Checks one sentence per job below on what passed.
#   * "Newest dependency versions break the server", this repository's
#     question. The auto-update extension and uvx install the newest versions
#     pyproject.toml allows, not the ones in uv.lock, so what a user runs can
#     change on any day without a release here. Two jobs feed it: newest,
#     the organisation's ready-made job of the repository, installs those
#     versions from the checkout and runs the tests and the smoke run against
#     Yahoo on them. index, a job of the organisation's workflow, installs the
#     published release from PyPI into a fresh environment, the path the
#     auto-update extension takes, and runs the smoke run with it. A run that
#     proves nothing, Yahoo refusing the locked versions too or rate-limiting
#     the run, leaves the alarm issue as it was.
#
# The run after each completed Publish is for the index job: it installs the
# release just published from PyPI, so a release that does not install stands
# in the alarm issue within minutes instead of at the next cron. The reasoning
# is in docs/freshness.md of benethos-hub/.github under "Calling it".
#
# Nothing here commits anything: the upgraded lockfile stays in the runner.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness

jobs:
  # A second after each call to Yahoo: a runner shares its address with
  # everyone else on GitHub, and a limit Yahoo sets for that address would
  # read as a failure. The smoke run exits with 3 on a rate limit, the
  # action's default for "no verdict".
  newest:
    name: Newest versions allowed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the newest versions allowed
        uses: benethos-hub/.github/actions/python/freshness-newest@main
        with:
          findings: ${{ runner.temp }}/freshness/newest
          extras: dev
          check: uv run --frozen python tests/smoke.py --pause 1

      - name: Leave the result for the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshness-newest
          path: ${{ runner.temp }}/freshness/newest
          retention-days: 7

  # Runs whatever happened before: a job that died before its upload is a
  # line in the pins report, not a silent gap, since extra-jobs names it.
  freshness:
    name: Freshness report
    needs: newest
    if: ${{ !cancelled() }}
    uses: benethos-hub/.github/.github/workflows/freshness.yml@main
    permissions:
      contents: read
      issues: write
    with:
      issue-title: Pinned versions have newer releases
      extra-jobs: newest
      alarm-title: Newest dependency versions break the server
      alarm-resolved: The newest dependency versions work.
      index: true
      index-check: $FRESHNESS_PYTHON tests/smoke.py --pause 1
