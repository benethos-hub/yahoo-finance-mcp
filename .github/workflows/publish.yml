name: Publish

# Publishes the release artefacts when a GitHub release is published:
#   * sdist + wheel to PyPI, via Trusted Publishing (OIDC, no stored token)
#   * the container image to ghcr.io, via the automatic GITHUB_TOKEN, as
#     benethos-yahoo-finance-mcp, the name of the distribution
#   * the Claude Desktop bundle (.mcpb) as an asset of the release itself
#   * server.json to the MCP Registry, via the same OIDC token, once the
#     three above are out
#
# Each upload is done by an action of the organisation in
# benethos-hub/.github (actions/publish), followed at main like the CI
# workflows. The jobs stay here because PyPI and the MCP Registry trust the
# workflow of the job that uploads. Every action first checks that the
# release tag is the version in its file: the wheel, pyproject.toml,
# manifest.json and server.json. A tag v0.7.0 on a commit that still said
# 0.6.1 once made PyPI refuse the upload while the image went out as 0.7.0.
#
# The PyPI, image and bundle jobs are independent, so a failure in one does
# not withhold the others. The registry entry points at all three and waits
# for them.
#
# Nothing is built before ci-passed has found a green CI run of the push to
# main for this very commit, waiting for it if it is still running. A version
# on PyPI cannot be replaced, and that run is the full CI with every required
# check, so it is not run again here. A commit that never reached main has no
# such run and stops the release. With audit, the gate also checks uv.lock
# against PyPI and OSV once more, for a vulnerability that became known
# between the merge and the release. Waive one in ignore-vulns there and in
# ci.yml alike.
#
# A manual run (workflow_dispatch) is the trial. pypi-trial builds and checks
# the package and asks PyPI whether it would take it, without uploading. A
# warning that the version is on PyPI already is expected before the version
# is raised. ghcr-publish pushes the image as `edge`, from main only: `edge`
# is documented as main's state, and a run started on another branch would
# push that branch under the same name. The bundle and the registry entry
# belong to a release and are skipped.
#
# One-time setup on PyPI (project owner): add a "pending publisher" for the
# project `benethos-yahoo-finance-mcp` with:
#   Owner: benethos-hub
#   Repository: yahoo-finance-mcp
#   Workflow filename: publish.yml
#   Environment: pypi-benethos-yahoo-finance-mcp
#
# The environment is named `pypi-` plus the distribution, so the Deployments
# list on GitHub says what was deployed where. Up to 0.7.1 it was plain `pypi`,
# and PyPI accepts an upload only from the environment its publisher names.
#
# One-time setup for ghcr, only possible after the first successful push: a new
# package is private even when its repository is public, so `docker pull` fails
# for everyone but the maintainer until it is switched over under
# Organisation -> Packages -> Package settings -> Change visibility -> Public.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Waits up to 30 minutes for a CI run of ci.yml on main still in progress.
  # On a manual run outside main it is skipped, together with everything that
  # needs it, instead of waiting five minutes and failing.
  ci-passed:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    uses: benethos-hub/.github/.github/workflows/python-release-ci-passed.yml@main
    permissions:
      actions: read # list the CI runs of this commit
      contents: read
    with:
      audit: true

  pypi-publish:
    name: Build and publish to PyPI
    # A version may be uploaded once only, so never by hand. The trial is
    # pypi-trial.
    if: github.event_name == 'release'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-yahoo-finance-mcp
      url: https://pypi.org/p/benethos-yahoo-finance-mcp
    # A job's permissions replace the workflow's, so contents: read is
    # repeated here for the checkout.
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PEP 561 marker decides whether a type checker looks at this
      # package at all once it is installed. Losing it from the wheel would
      # break downstream type checking without failing a test, an import or
      # the build.
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          wheel-contains: benethos_yahoo_finance_mcp/py.typed

  # The PyPI half of a manual run, without the environment and without an
  # OIDC token, since nothing is uploaded.
  pypi-trial:
    name: Build and check for PyPI (trial)
    if: github.event_name == 'workflow_dispatch'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          dry-run: true
          wheel-contains: benethos_yahoo_finance_mcp/py.typed

  ghcr-publish:
    name: Build and publish the image
    # A release, or a manual run on main. See the header.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries the distribution's name. Up to 0.7.1 it was named
      # after the repository, yahoo-finance-mcp, which gets nothing since
      # 0.8.0. arm64 is emulated on the amd64 runner. Nothing is compiled
      # from source here (pandas and numpy ship aarch64 wheels), so the cost
      # stays modest. The arm64 build of the docker job in ci.yml writes its
      # layers to the cache scope buildkit, and the release reads them from
      # there.
      - uses: benethos-hub/.github/actions/publish/ghcr@main
        with:
          image: benethos-yahoo-finance-mcp
          dockerfile: containers/images/yahoo-finance-mcp/Dockerfile
          cache-scope: buildkit

  mcpb-bundle:
    name: Attach the Claude Desktop bundle
    # The bundle goes onto the release it is built for, and a manual run has
    # no release to attach it to.
    if: github.event_name == 'release'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the bundle as a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is for the upload, nothing here pushes.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Stage the bundle
        run: uv run --no-project .github/publish/mcpb/build.py "$RUNNER_TEMP/bundle"

      # Attached twice, under its version and without, which gives the README
      # a link that always reaches the newest full release
      # (releases/latest/download/benethos-yahoo-finance-mcp.mcpb).
      - uses: benethos-hub/.github/actions/publish/mcpb@main
        with:
          staged: ${{ runner.temp }}/bundle
          name: benethos-yahoo-finance-mcp

  mcp-registry:
    name: Publish to the MCP Registry
    # The registry checks every package when it takes the entry: the README
    # of this version on PyPI must carry the mcp-name line, the image config
    # the label, and the bundle must be downloadable and match its checksum.
    # So it runs only once all three are out, and a pre-release is not
    # listed at all.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [pypi-publish, ghcr-publish, mcpb-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the registry grants io.github.benethos-hub/* to this token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: benethos-hub/.github/actions/publish/mcp-registry@main
