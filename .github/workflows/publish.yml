name: Publish

# Publishes the release artefacts when a GitHub release is published:
#   * sdist + wheel to PyPI, via Trusted Publishing (OIDC, no stored token)
#   * the container image to ghcr.io, via the automatic GITHUB_TOKEN
#
# The two jobs are independent, so a failure in one does not withhold the other.
#
# `workflow_dispatch` exercises the container half alone and tags the result
# `edge`. PyPI is skipped there, because a version may only be uploaded once and
# a manual run carries no release tag to derive one from.
#
# One-time setup on PyPI (project owner): add a "pending publisher" for the
# project `benethos-yahoo-finance-mcp` with:
#   Owner: benethos-hub
#   Repository: yahoo-finance-mcp
#   Workflow filename: publish.yml
#   Environment: pypi
#
# One-time setup for ghcr, only possible after the first successful push: a new
# package is private even when its repository is public, so `docker pull` fails
# for everyone but the maintainer until it is switched over under
# Organisation -> Packages -> Package settings -> Change visibility -> Public.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    # A manual run has no version to publish, and PyPI rejects a re-upload.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/benethos-yahoo-finance-mcp
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      # A file that exists in the repository is not a file that ships. The
      # PEP 561 marker decides whether a type checker looks at this package at
      # all once it is installed, and losing it from the wheel would break
      # downstream type checking without failing a test, an import or the
      # build. Once a version is on PyPI it cannot be replaced, so the check
      # belongs here, in front of the upload.
      - name: Check the wheel ships the py.typed marker
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          if ! unzip -l "${wheel}" | grep -q "benethos_yahoo_finance_mcp/py.typed"; then
            echo "::error::${wheel} does not contain benethos_yahoo_finance_mcp/py.typed."
            echo "::error::Without the marker every annotation in this package is ignored by type checkers."
            unzip -l "${wheel}"
            exit 1
          fi
          echo "py.typed is present in ${wheel}"

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always

  ghcr-publish:
    name: Build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on the amd64 runner. Nothing is compiled from source
      # here (pandas and numpy ship aarch64 wheels), so the cost stays modest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the tags from the release tag (v0.4.0 -> 0.4.0, 0.4, latest)
      # and emits the OCI labels, among them org.opencontainers.image.source,
      # which is what links the package to this repository on GitHub.
      - name: Derive image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotate the index (the manifest list) as well as the individual
          # manifests. The default is manifests only, and for a multi-arch image
          # the GitHub package page reads the index — which is why 0.4.0 showed
          # "No description provided" while carrying the description in its image
          # config all along.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
