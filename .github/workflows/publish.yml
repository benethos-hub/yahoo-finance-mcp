name: Publish

# Publishes the release artefacts when a GitHub release is published:
#   * sdist + wheel to PyPI, via Trusted Publishing (OIDC, no stored token)
#   * the container image to ghcr.io, via the automatic GITHUB_TOKEN, as
#     benethos-yahoo-finance-mcp, the name of the distribution
#
# The two jobs are independent, so a failure in one does not withhold the other.
#
# `workflow_dispatch` exercises the container half alone and tags the result
# `edge`. PyPI is skipped there, because a version may only be uploaded once and
# a manual run carries no release tag to derive one from. A manual run builds
# from main only: `edge` is documented as main's state, and a run started on
# another branch would have pushed that branch under the same name.
#
# Both jobs first check that the release tag is the package version. The two
# are written in different places, and a tag v0.7.0 on a commit that still
# says 0.6.1 made PyPI refuse the upload while the image job pushed 0.7.0,
# 0.7 and latest with the old code.
#
# One-time setup on PyPI (project owner): add a "pending publisher" for the
# project `benethos-yahoo-finance-mcp` with:
#   Owner: benethos-hub
#   Repository: yahoo-finance-mcp
#   Workflow filename: publish.yml
#   Environment: pypi-benethos-yahoo-finance-mcp
#
# The environment is named `pypi-` plus the distribution, so the Deployments
# list on GitHub says what was deployed where. Up to 0.7.1 it was plain `pypi`,
# and PyPI accepts an upload only from the environment its publisher names.
#
# One-time setup for ghcr, only possible after the first successful push: a new
# package is private even when its repository is public, so `docker pull` fails
# for everyone but the maintainer until it is switched over under
# Organisation -> Packages -> Package settings -> Change visibility -> Public.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    # A manual run has no version to publish, and PyPI rejects a re-upload.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-yahoo-finance-mcp
      url: https://pypi.org/p/benethos-yahoo-finance-mcp
    # A job's permissions replace the workflow's, so contents: read is
    # repeated here for the checkout.
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release tag is the package version
        run: python3 .github/scripts/tag_matches_version.py

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build sdist and wheel
        run: uv build

      # A file that exists in the repository is not a file that ships. The
      # PEP 561 marker decides whether a type checker looks at this package at
      # all once it is installed, and losing it from the wheel would break
      # downstream type checking without failing a test, an import or the
      # build. Once a version is on PyPI it cannot be replaced, so the check
      # belongs here, in front of the upload.
      - name: Check the wheel ships the py.typed marker
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          if ! unzip -l "${wheel}" | grep -q "benethos_yahoo_finance_mcp/py.typed"; then
            echo "::error::${wheel} does not contain benethos_yahoo_finance_mcp/py.typed."
            echo "::error::Without the marker every annotation in this package is ignored by type checkers."
            unzip -l "${wheel}"
            exit 1
          fi
          echo "py.typed is present in ${wheel}"

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always

  ghcr-publish:
    name: Build and publish the image
    # A release, or a manual run on main. See the header.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release tag is the package version
        if: github.event_name == 'release'
        run: python3 .github/scripts/tag_matches_version.py

      # arm64 is emulated on the amd64 runner. Nothing is compiled from source
      # here (pandas and numpy ship aarch64 wheels), so the cost stays modest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the tags from the release tag (v0.4.0 -> 0.4.0, 0.4, latest)
      # and emits the OCI labels, among them org.opencontainers.image.source,
      # which is what links the package to this repository on GitHub. A
      # pre-release gets its exact version only: latest stays on the last
      # full release, and the action writes no minor tag for a pre-release.
      - name: Derive image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the index (the manifest list) as well as the individual
          # manifests. The default is manifests only, and for a multi-arch image
          # the GitHub package page reads the index — which is why 0.4.0 showed
          # "No description provided" while carrying the description in its image
          # config all along.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        # The image carries the distribution's name. Up to 0.7.1 it was named
        # after the repository, yahoo-finance-mcp, and the 0.7 line was pushed
        # there as well, from the same build and with the same digest. From
        # 0.8.0 on the old name gets nothing, and tests/test_packaging.py goes
        # red should it come back into this list.
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/benethos-yahoo-finance-mcp
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/yahoo-finance-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Read the published index back instead of trusting that the annotations
      # above arrived. Setting them and assuming is exactly what produced a
      # package page reading "No description provided" while the image carried
      # the description in its configuration all along, and by the time anyone
      # looks at that page the release has already happened.
      #
      # Every tag is read, not only the first: each must be the very same
      # index, byte for byte, or one tag would serve another build.
      - name: The published index carries what the package page reads
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          ref=$(printf '%s\n' "$TAGS" | head -1)
          echo "inspecting ${ref}"
          docker buildx imagetools inspect "$ref" --raw > /tmp/index.json
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag" --raw > /tmp/other.json
            if ! cmp -s /tmp/index.json /tmp/other.json; then
              echo "::error::${tag} is not the same index as ${ref}"
              exit 1
            fi
            echo "same index: ${tag}"
          done
          python3 - <<'PY'
          import json

          index = json.load(open("/tmp/index.json"))
          annotations = index.get("annotations") or {}
          # The unknown/unknown entries are the provenance attestations, one per
          # real platform. They are expected and are not architectures.
          platforms = sorted(
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("architecture") != "unknown"
          )
          missing = [
              key
              for key in (
                  "org.opencontainers.image.description",
                  "org.opencontainers.image.source",
                  "org.opencontainers.image.version",
              )
              if not annotations.get(key)
          ]
          assert not missing, f"the index carries no {missing}, so the package page shows nothing"
          assert "linux/amd64" in platforms, f"amd64 is missing, the index holds {platforms}"
          assert "linux/arm64" in platforms, f"arm64 is missing, the index holds {platforms}"
          print("OK:", ", ".join(platforms))
          print("   ", annotations["org.opencontainers.image.description"])
          PY
