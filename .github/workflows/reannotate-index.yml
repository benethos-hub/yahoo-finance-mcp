name: Re-annotate image index

# One-shot maintenance job, to be removed once it has run.
#
# The 0.4.0 image was built before publish.yml annotated the index, so its index
# carries no annotations and the GitHub package page shows "No description
# provided" even though the image config holds the labels all along. See PR #21
# for the permanent fix, which takes effect from the release after 0.4.0.
#
# `imagetools create` rewrites the index of an already published image: the
# platform manifests and every layer keep their digests and nothing is rebuilt
# or re-uploaded, only the index itself is written anew. The index digest does
# change, so anything pinned to the old one no longer resolves.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Digest of the index to re-annotate
        required: true
        default: sha256:8b184a8999763d5fe950f0174cfaae5b90c431e9f8cb85e8d88bc59ed08502e4
      tags:
        description: Comma-separated tags to point at the rewritten index
        required: true
        default: 0.4.0,0.4,latest
      version:
        description: Value for org.opencontainers.image.version
        required: true
        default: 0.4.0
      revision:
        description: Value for org.opencontainers.image.revision
        required: true
        default: 82efff9d558d738ac30523bb5f160200b9f8189b

permissions:
  contents: read

jobs:
  reannotate:
    name: Rewrite the index with annotations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same keys metadata-action emits, so the rewritten index matches what
      # a regular release now produces. The description is taken live from the
      # repository, which is also where metadata-action reads it.
      - name: Rewrite the index
        env:
          SOURCE: ${{ inputs.source }}
          TAGS: ${{ inputs.tags }}
          DESCRIPTION: ${{ github.event.repository.description }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          URL: ${{ github.server_url }}/${{ github.repository }}
          TITLE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          args=()
          for tag in ${TAGS//,/ }; do
            args+=(--tag "${IMAGE}:${tag}")
          done

          annotate() {
            args+=(--annotation "index:org.opencontainers.image.$1")
          }
          annotate "description=${DESCRIPTION}"
          annotate "source=${URL}"
          annotate "url=${URL}"
          annotate "title=${TITLE}"
          annotate "licenses=MIT"
          annotate "version=${VERSION}"
          annotate "revision=${REVISION}"

          printf 'arg: %s\n' "${args[@]}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${SOURCE}"

      - name: Verify the annotations are on the index
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS//,/ }; do
            echo "=== ${IMAGE}:${tag} ==="
            raw=$(docker buildx imagetools inspect --raw "${IMAGE}:${tag}")
            echo "${raw}" | jq -e '.annotations["org.opencontainers.image.description"]'
          done
