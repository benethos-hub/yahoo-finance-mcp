version: 2
# Minor and patch updates arrive as one pull request per ecosystem and week
# instead of one each. They are the routine ones, and a single run of the
# gates covers them together. A major update still comes on its own, since
# that is where behaviour changes and it wants its own review.
updates:
  # Python dependencies. The ecosystem is "uv", not "pip", because the versions
  # that actually get installed are the ones pinned in uv.lock, and the pip
  # ecosystem does not read that file. The two together were silent. The
  # lockfile drifted fifteen packages behind, mcp and yfinance among them, and
  # not one pull request said so. Six requirements in pyproject.toml stay inside
  # a patch window (mcp, yfinance, pandas, pydantic, lxml, curl_cffi). A release
  # past one of them needs the window lifted, and that pull request is the place
  # to check it.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # A release the window allows changes uv.lock only, and one past it moves the
    # window, as `~=` again. Left to itself Dependabot takes this project for a
    # library, since its description matches PyPI, and widens to a range over two
    # minors, which is no patch window any more.
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Always alone, whatever the size of the bump: the suite mocks
        # yfinance completely and never travels through the SDK, so neither
        # change is seen by it. Each needs its own checks, the smoke run
        # before and after for yfinance and a call through the SDK for mcp
        # (CLAUDE.md, Verifying). The other four stay inside a patch window too,
        # and a minor of theirs is checked the same way (CLAUDE.md, Releasing).
        exclude-patterns: ["yfinance", "mcp", "pandas", "pydantic", "lxml", "curl*cffi"]

  # The actions the workflows use, each pinned to a full commit SHA with the
  # version it stands for in a trailing comment. A tag, even an exact one, is a
  # pointer its owner can move, and the publish workflow holds the credentials
  # that push to PyPI and ghcr. A SHA cannot be moved. The price is a pull
  # request for every release, patches included, which is what this entry is
  # for: Dependabot reads the comment and raises SHA and comment together.
  #
  # This also retires the question of moving majors. astral-sh/setup-uv
  # stopped publishing major tags after v7, and `@v7` kept working while the
  # repository fell three majors behind without a word. With every action
  # pinned exactly, all of them are in the same position, and Dependabot is
  # what notices for each.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The images of the Dockerfile, python and uv, pinned by digest beside their
  # tag. The base was pinned to python:3.12-slim long after 3.14 was out, and
  # nothing said so: the image built, the container ran and every gate stayed
  # green on a base two releases behind. A stale base is not a build failure,
  # it is unpatched packages in something people pull.
  - package-ecosystem: "docker"
    directory: "/containers/images/yahoo-finance-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
