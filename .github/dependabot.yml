version: 2
# Minor and patch updates arrive as one pull request per ecosystem and week
# instead of one each. They are the routine ones, and a single run of the
# gates covers them together. A major update still comes on its own, since
# that is where behaviour changes and it wants its own review.
updates:
  # Python dependencies. The ecosystem is "uv", not "pip", because the versions
  # that actually get installed are the ones pinned in uv.lock, and the pip
  # ecosystem does not read that file. "pip" had nothing to raise here anyway:
  # every requirement in pyproject.toml is a `>=`, so the newest release is
  # always allowed already and no constraint ever needs lifting. The two
  # together were silent. The lockfile drifted fifteen packages behind, mcp and
  # yfinance among them, and not one pull request said so.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # These two always come alone, whatever the size of the bump: the
        # gates mock both, so each needs its own checks (CLAUDE.md, Verifying).
        exclude-patterns: ["yfinance", "mcp"]

  # The actions the workflows use, each pinned to a full commit SHA with the
  # version it stands for in a trailing comment. A tag, even an exact one, is a
  # pointer its owner can move, and the publish workflow holds the credentials
  # that push to PyPI and ghcr. A SHA cannot be moved. The price is a pull
  # request for every release, patches included, which is what this entry is
  # for: Dependabot reads the comment and raises SHA and comment together.
  #
  # This also retires the question of moving majors. astral-sh/setup-uv
  # stopped publishing major tags after v7, and `@v7` kept working while the
  # repository fell three majors behind without a word. With every action
  # pinned exactly, all of them are in the same position, and Dependabot is
  # what notices for each.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The base image in the Dockerfile. It was pinned to python:3.12-slim long
  # after 3.14 was out, and nothing said so: the image built, the container ran
  # and every gate stayed green on a base two releases behind. A stale base is
  # not a build failure, it is unpatched packages in something people pull.
  - package-ecosystem: "docker"
    directory: "/containers/images/yahoo-finance-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
